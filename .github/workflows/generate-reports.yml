name: Generate quota reports

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "usage/**/*.json"
      - "scripts/generate_reports.py"
      - ".github/workflows/generate-reports.yml"

permissions:
  contents: write

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate reports
        run: python scripts/generate_reports.py

      - name: Write job summary
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成用量报告。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit reports
        run: |
          if git diff --quiet -- reports; then
            echo "No report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "Generate usage reports"
          git push
